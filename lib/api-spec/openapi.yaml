openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Rehab Session Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: clients
  - name: goals
  - name: sessions
  - name: notes
  - name: exercises
  - name: corrections
  - name: dashboard
  - name: storage
  - name: homework
  - name: videoLibrary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewClient" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /clients/{clientId}:
    get:
      operationId: getClient
      tags: [clients]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      parameters:
        - { name: clientId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, achieved, paused, archived] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Goal" }
    post:
      operationId: createGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewGoal" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }

  /goals/{goalId}:
    get:
      operationId: getGoal
      tags: [goals]
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
    patch:
      operationId: updateGoal
      tags: [goals]
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
    delete:
      operationId: deleteGoal
      tags: [goals]
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      parameters:
        - { name: clientId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
    post:
      operationId: createSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSession" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
    patch:
      operationId: updateSession
      tags: [sessions]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
    delete:
      operationId: deleteSession
      tags: [sessions]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /sessions/{sessionId}/notes:
    get:
      operationId: listSessionNotes
      tags: [notes]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
    post:
      operationId: createSessionNote
      tags: [notes]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewNote" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }

  /notes/{noteId}:
    patch:
      operationId: updateNote
      tags: [notes]
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
    delete:
      operationId: deleteNote
      tags: [notes]
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /sessions/{sessionId}/exercises:
    get:
      operationId: listSessionExercises
      tags: [exercises]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exercise" }
    post:
      operationId: createSessionExercise
      tags: [exercises]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewExercise" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }

  /exercises/{exerciseId}:
    patch:
      operationId: updateExercise
      tags: [exercises]
      parameters:
        - { name: exerciseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExerciseUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
    delete:
      operationId: deleteExercise
      tags: [exercises]
      parameters:
        - { name: exerciseId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /clients/{clientId}/exercise-progress:
    get:
      operationId: getClientExerciseProgress
      tags: [exercises]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExerciseProgress" }

  /corrections:
    get:
      operationId: listCorrections
      tags: [corrections]
      responses:
        "200":
          description: List of corrections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Correction" }
    post:
      operationId: createCorrection
      tags: [corrections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCorrection" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Correction" }
  /corrections/{correctionId}:
    put:
      operationId: updateCorrection
      tags: [corrections]
      parameters:
        - { name: correctionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Correction" }
    delete:
      operationId: deleteCorrection
      tags: [corrections]
      parameters:
        - { name: correctionId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }

  /dashboard/upcoming-sessions:
    get:
      operationId: getUpcomingSessions
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for direct file upload to GCS
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned URL generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }

  /video-library:
    get:
      operationId: listVideoLibrary
      tags: [videoLibrary]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoLibraryItem" }
    post:
      operationId: createVideoLibraryItem
      tags: [videoLibrary]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewVideoLibraryItem" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoLibraryItem" }

  /video-library/{videoId}:
    patch:
      operationId: updateVideoLibraryItem
      tags: [videoLibrary]
      parameters:
        - { name: videoId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoLibraryItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoLibraryItem" }
    delete:
      operationId: deleteVideoLibraryItem
      tags: [videoLibrary]
      parameters:
        - { name: videoId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /homework/programs:
    get:
      tags: [homework]
      operationId: listHomeworkPrograms
      parameters:
        - { name: clientId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: List of programs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HomeworkProgram" }
    post:
      tags: [homework]
      operationId: createHomeworkProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewHomeworkProgram" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeworkProgram" }

  /homework/programs/{programId}:
    get:
      tags: [homework]
      operationId: getHomeworkProgram
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeworkProgram" }
    patch:
      tags: [homework]
      operationId: updateHomeworkProgram
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeworkProgramUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeworkProgram" }
    delete:
      tags: [homework]
      operationId: deleteHomeworkProgram
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /homework/programs/{programId}/exercises:
    get:
      tags: [homework]
      operationId: listHomeworkExercises
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: List of exercises
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HomeworkExercise" }
    post:
      tags: [homework]
      operationId: createHomeworkExercise
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewHomeworkExercise" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeworkExercise" }

  /homework/exercises/{exerciseId}:
    patch:
      tags: [homework]
      operationId: updateHomeworkExercise
      parameters:
        - { name: exerciseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeworkExerciseUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeworkExercise" }
    delete:
      tags: [homework]
      operationId: deleteHomeworkExercise
      parameters:
        - { name: exerciseId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /homework/programs/{programId}/send-reminder:
    post:
      tags: [homework]
      operationId: sendHomeworkReminder
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, magicLink]
                properties:
                  ok: { type: boolean }
                  magicLink: { type: string }

  /homework/view/{token}:
    get:
      tags: [homework]
      operationId: getHomeworkView
      summary: Public magic-link view for client homework
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Client homework view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeworkView" }
        "404": { description: Token not found or expired }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Client:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        condition: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    NewClient:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        condition: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
    ClientUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        condition: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }

    Goal:
      type: object
      required: [id, clientId, title, status, progress, createdAt]
      properties:
        id: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        status: { type: string, enum: [active, achieved, paused, archived] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        targetDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
    NewGoal:
      type: object
      required: [clientId, title]
      properties:
        clientId: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        status: { type: string, enum: [active, achieved, paused, archived] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        targetDate: { type: string, format: date, nullable: true }
    GoalUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        status: { type: string, enum: [active, achieved, paused, archived] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        targetDate: { type: string, format: date, nullable: true }

    Session:
      type: object
      required: [id, clientId, sessionDate, createdAt]
      properties:
        id: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        title: { type: string, nullable: true }
        sessionDate: { type: string, format: date-time }
        durationMinutes: { type: integer, nullable: true }
        focusArea: { type: string, nullable: true }
        painLevel: { type: integer, minimum: 0, maximum: 10, nullable: true }
        energyLevel: { type: integer, minimum: 0, maximum: 10, nullable: true }
        summary: { type: string, nullable: true }
        noteCount: { type: integer }
        createdAt: { type: string, format: date-time }
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          properties:
            notes:
              type: array
              items: { $ref: "#/components/schemas/Note" }
            goals:
              type: array
              items: { $ref: "#/components/schemas/Goal" }
    NewSession:
      type: object
      required: [clientId, sessionDate]
      properties:
        clientId: { type: string }
        title: { type: string, nullable: true }
        sessionDate: { type: string, format: date-time }
        durationMinutes: { type: integer, nullable: true }
        focusArea: { type: string, nullable: true }
        painLevel: { type: integer, minimum: 0, maximum: 10, nullable: true }
        energyLevel: { type: integer, minimum: 0, maximum: 10, nullable: true }
        summary: { type: string, nullable: true }
    SessionUpdate:
      type: object
      properties:
        title: { type: string, nullable: true }
        sessionDate: { type: string, format: date-time }
        durationMinutes: { type: integer, nullable: true }
        focusArea: { type: string, nullable: true }
        painLevel: { type: integer, minimum: 0, maximum: 10, nullable: true }
        energyLevel: { type: integer, minimum: 0, maximum: 10, nullable: true }
        summary: { type: string, nullable: true }

    Note:
      type: object
      required: [id, sessionId, content, kind, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        goalId: { type: string, nullable: true }
        content: { type: string }
        kind: { type: string, enum: [observation, win, concern, action, measurement] }
        important: { type: boolean }
        createdAt: { type: string, format: date-time }
    NewNote:
      type: object
      required: [content, kind]
      properties:
        content: { type: string, minLength: 1 }
        kind: { type: string, enum: [observation, win, concern, action, measurement] }
        important: { type: boolean }
        goalId: { type: string, nullable: true }
    NoteUpdate:
      type: object
      properties:
        content: { type: string }
        kind: { type: string, enum: [observation, win, concern, action, measurement] }
        important: { type: boolean }
        goalId: { type: string, nullable: true }

    ExerciseSet:
      type: object
      required: [weight, reps]
      properties:
        weight: { type: number }
        reps: { type: integer, minimum: 0 }
    Exercise:
      type: object
      required: [id, sessionId, name, unit, sets, position, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        name: { type: string }
        unit: { type: string, enum: [kg, lb] }
        sets:
          type: array
          items: { $ref: "#/components/schemas/ExerciseSet" }
        notes: { type: string, nullable: true }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
    NewExercise:
      type: object
      required: [name, sets]
      properties:
        name: { type: string, minLength: 1 }
        unit: { type: string, enum: [kg, lb] }
        sets:
          type: array
          items: { $ref: "#/components/schemas/ExerciseSet" }
        notes: { type: string, nullable: true }
        position: { type: integer }
    ExerciseUpdate:
      type: object
      properties:
        name: { type: string }
        unit: { type: string, enum: [kg, lb] }
        sets:
          type: array
          items: { $ref: "#/components/schemas/ExerciseSet" }
        notes: { type: string, nullable: true }
        position: { type: integer }

    ExerciseProgressPoint:
      type: object
      required: [sessionId, sessionDate, maxWeight, totalReps, totalVolume, topSetReps]
      properties:
        sessionId: { type: string }
        sessionDate: { type: string, format: date-time }
        maxWeight: { type: number }
        topSetReps: { type: integer }
        totalReps: { type: integer }
        totalVolume: { type: number }
    ExerciseProgress:
      type: object
      required: [name, unit, points]
      properties:
        name: { type: string }
        unit: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/ExerciseProgressPoint" }

    Correction:
      type: object
      required: [id, raw, corrected, isDefault, createdAt]
      properties:
        id: { type: string }
        raw: { type: string }
        corrected: { type: string }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
    NewCorrection:
      type: object
      required: [raw, corrected]
      properties:
        raw: { type: string }
        corrected: { type: string }
        isDefault: { type: boolean }
    CorrectionUpdate:
      type: object
      properties:
        raw: { type: string }
        corrected: { type: string }
    DashboardSummary:
      type: object
      required: [totalClients, totalSessions, activeGoals, achievedGoals, importantNotes, sessionsThisWeek]
      properties:
        totalClients: { type: integer }
        totalSessions: { type: integer }
        activeGoals: { type: integer }
        achievedGoals: { type: integer }
        importantNotes: { type: integer }
        sessionsThisWeek: { type: integer }
        avgPainLevel: { type: number, nullable: true }
        avgEnergyLevel: { type: number, nullable: true }

    ActivityItem:
      type: object
      required: [id, kind, title, timestamp]
      properties:
        id: { type: string }
        kind: { type: string, enum: [session, note, goal] }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        clientName: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer }
        contentType: { type: string }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        metadata:
          type: object
          nullable: true
          properties:
            name: { type: string }
            size: { type: integer }
            contentType: { type: string }

    HomeworkProgram:
      type: object
      required: [id, clientId, title, isActive, createdAt]
      properties:
        id: { type: string }
        clientId: { type: string }
        title: { type: string }
        notes: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    NewHomeworkProgram:
      type: object
      required: [clientId, title]
      properties:
        clientId: { type: string }
        title: { type: string }
        notes: { type: string, nullable: true }
    HomeworkProgramUpdate:
      type: object
      properties:
        title: { type: string }
        notes: { type: string, nullable: true }
        isActive: { type: boolean }

    HomeworkExercise:
      type: object
      required: [id, programId, name, frequencyType, daysOfWeek, timesPerDay, position, createdAt]
      properties:
        id: { type: string }
        programId: { type: string }
        name: { type: string }
        sets: { type: integer, nullable: true }
        reps: { type: integer, nullable: true }
        weight: { type: integer, nullable: true }
        unit: { type: string }
        durationSeconds: { type: integer, nullable: true }
        frequencyType: { type: string, enum: [daily, specific_days, times_per_week] }
        daysOfWeek:
          type: array
          items: { type: integer }
        timesPerWeek: { type: integer, nullable: true }
        timesPerDay: { type: integer }
        videoUrl: { type: string, nullable: true }
        instructions: { type: string, nullable: true }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
    NewHomeworkExercise:
      type: object
      required: [name, frequencyType]
      properties:
        name: { type: string }
        sets: { type: integer, nullable: true }
        reps: { type: integer, nullable: true }
        weight: { type: integer, nullable: true }
        unit: { type: string }
        durationSeconds: { type: integer, nullable: true }
        frequencyType: { type: string, enum: [daily, specific_days, times_per_week] }
        daysOfWeek:
          type: array
          items: { type: integer }
        timesPerWeek: { type: integer, nullable: true }
        timesPerDay: { type: integer }
        videoUrl: { type: string, nullable: true }
        instructions: { type: string, nullable: true }
        position: { type: integer }
    HomeworkExerciseUpdate:
      type: object
      properties:
        name: { type: string }
        sets: { type: integer, nullable: true }
        reps: { type: integer, nullable: true }
        weight: { type: integer, nullable: true }
        unit: { type: string }
        durationSeconds: { type: integer, nullable: true }
        frequencyType: { type: string, enum: [daily, specific_days, times_per_week] }
        daysOfWeek:
          type: array
          items: { type: integer }
        timesPerWeek: { type: integer, nullable: true }
        timesPerDay: { type: integer }
        videoUrl: { type: string, nullable: true }
        instructions: { type: string, nullable: true }
        position: { type: integer }

    VideoLibraryItem:
      type: object
      required: [id, title, url, tags, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        url: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    NewVideoLibraryItem:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        url: { type: string }
        tags:
          type: array
          items: { type: string }
    VideoLibraryItemUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        url: { type: string }
        tags:
          type: array
          items: { type: string }

    HomeworkView:
      type: object
      required: [clientName, programs]
      properties:
        clientName: { type: string }
        programs:
          type: array
          items:
            type: object
            required: [id, title, exercises]
            properties:
              id: { type: string }
              title: { type: string }
              notes: { type: string, nullable: true }
              exercises:
                type: array
                items: { $ref: "#/components/schemas/HomeworkExercise" }
