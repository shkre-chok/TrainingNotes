services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainingnotes
      POSTGRES_PASSWORD: trainingnotes
      POSTGRES_DB: trainingnotes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainingnotes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
